# TF-IDF + Ridge Fast Text Baseline Configuration

experiment:
  id: "baseline_ridge"
  seed: 42
  notes: "Fast 5-Fold Stratified TF-IDF (1-2 gram) + Ridge Regression with log1p target"

data:
  train_path: "data/raw/train.csv"
  test_path: "data/raw/test.csv"
  id_col: "sample_id"
  target_col: "target_price"
  group_col: "category"
  allow_zero_target: false

validation:
  strategy: "stratified"
  n_splits: 5
  seed: 42
  n_bins: 10

model:
  type: "ridge"
  params:
    alpha: 2.0
    max_features: 30000
    target_log: true
    min_clip: 0.01
    random_state: 42

output:
  submission_dir: "artifacts/submissions"
  submission_filename: "baseline_ridge_sub.csv"
  target_name_in_sub: "prediction"
