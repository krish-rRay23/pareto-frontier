# Default competition experiment configuration

experiment:
  id: "default_experiment"
  seed: 42
  notes: "Base configuration file"

data:
  train_path: "data/raw/train.csv"
  test_path: "data/raw/test.csv"
  id_col: "sample_id"
  target_col: "target_price"
  group_col: "category"
  allow_zero_target: false

validation:
  strategy: "stratified"  # 'stratified', 'kfold', 'group', 'stratified_group'
  n_splits: 5
  seed: 42
  n_bins: 10

model:
  type: "ridge"
  params:
    alpha: 1.0
    max_features: 25000
    target_log: true
    min_clip: 0.001
    random_state: 42

output:
  submission_dir: "artifacts/submissions"
  submission_filename: "submission.csv"
  target_name_in_sub: "prediction"
