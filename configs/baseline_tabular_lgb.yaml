# GBDT Baseline on Catalog Tabular Features

experiment:
  id: "baseline_tabular_lgb"
  seed: 42
  notes: "5-Fold GBDT on regex catalog features (units, pack count, text density, keywords)"

data:
  train_path: "data/raw/train.csv"
  test_path: "data/raw/test.csv"
  id_col: "sample_id"
  target_col: "target_price"
  group_col: "category"
  allow_zero_target: false

validation:
  strategy: "stratified"
  n_splits: 5
  seed: 42
  n_bins: 10

model:
  type: "gbdt"
  params:
    engine: "auto"  # lightgbm -> catboost -> hist_gbdt fallback
    n_estimators: 250
    learning_rate: 0.05
    max_depth: 6
    target_log: true
    min_clip: 0.01
    random_state: 42

output:
  submission_dir: "artifacts/submissions"
  submission_filename: "baseline_gbdt_sub.csv"
  target_name_in_sub: "prediction"
